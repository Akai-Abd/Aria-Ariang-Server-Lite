services:
  aria2-pro:
    image: baba2580/aria2-pro:latest
    container_name: aria2-pro
    user: "0:0"
    environment:
      - RPC_SECRET=${RPC_SECRET}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./aria2:/config
      - ./script:/config/script
      - /var/run/docker.sock:/var/run/docker.sock
      - ./downloads:/downloads
      - ./cloud-destinations.json:/config/cloud-destinations.json:ro
      - ./rclone:/config/rclone
    networks:
      - aria2-net
    restart: always

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./aria2-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ariang:/usr/share/nginx/html:rw
      - ./certs:/etc/nginx/certs:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./downloads:/usr/share/nginx/html/download:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - aria2-net
    restart: always

networks:
  aria2-net:
    driver: bridge
    name: aria2-net

volumes:
  certbot-webroot:
  certbot-certs:
