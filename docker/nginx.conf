# Aria-Ariang Lite - All-in-One Nginx Configuration
# HTTP only (use a reverse proxy for SSL in production)

server {
    listen 80 default_server;
    server_name _;

    # Global Basic Authentication
    auth_basic "Aria-Ariang Lite Server";
    auth_basic_user_file /config/.htpasswd;

    # AriaNg Web UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Aria2 JSON-RPC (Bypasses Basic Auth - Uses RPC Secret)
    location /jsonrpc {
        auth_basic off;
        proxy_pass http://127.0.0.1:6800/jsonrpc;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Lightweight Direct Download & File Browser (Nginx Autoindex)
    location /download/ {
        alias /downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }
}
