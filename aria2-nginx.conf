# HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/aria2.pem;
    ssl_certificate_key /etc/nginx/certs/aria2.key;

    # Global Basic Authentication
    auth_basic "Aria-Ariang Lite Server";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # AriaNg Web UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Aria2 JSON-RPC (Bypasses Basic Auth - Uses RPC Secret)
    location /jsonrpc {
        auth_basic off;
        proxy_pass http://aria2-pro:6800/jsonrpc;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Lightweight Direct Download & File Browser (Nginx Autoindex)
    location /download/ {
        alias /usr/share/nginx/html/download/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }
}
